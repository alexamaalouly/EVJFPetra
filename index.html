<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Petra — EVJF Bilbao 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Outfit:wght@300;400;500;600&family=Pinyon+Script&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  /* Thème Rose Poudré & Champagne */
  --rose:#C1687E; --rose-l:#F2D0D8; --rose-xl:#F9F5F6; --rose-d:#8A2E46;
  --ink:#43242B; --ink-m:#6B4050; --ink-s:#B08090;
  --paper:#FDFBF7; --line:#EAD3D9; --white:#FFFFFF;
  --r:16px; --rl:24px; --t:.2s ease;
}
body { font-family:'Outfit',sans-serif; background:var(--paper); color:var(--ink); }

/* Mise en avant des photos Livre d'Or */
.gb-av { width: 90px; height: 90px; border-radius: 50%; object-fit: cover; border: 3px solid var(--rose-l); }
.gb-hdr { display: flex; align-items: center; gap: 16px; margin-bottom: 16px; }
.gb-author { font-family:'Libre Baskerville',serif; font-style:italic; font-size:20px; color:var(--rose); }

/* Reste du CSS... (gardez vos structures existantes, elles sont compatibles avec ces nouvelles variables) */
</style>
</head>
<body>

<div id="gate">
  <div class="gate-logo">Petra</div>
  <div class="gate-sub">EVJF · Bilbao · 8–10 Mai 2026</div>
  <div class="gate-form">
    <input class="f-inp" id="g-name" placeholder="Prénom">
    <div class="g2">
        <input type="date" id="g-arr" min="2026-05-08">
        <input type="time" id="g-arr-t">
    </div>
    <label class="gb-photo-lbl">Photo de profil 
        <input type="file" id="g-file" accept="image/*" hidden>
    </label>
    <button class="gate-btn" onclick="register()">Accéder au site</button>
  </div>
</div>

<div class="home-date">8 — 10 Mai 2026</div>

</html>
